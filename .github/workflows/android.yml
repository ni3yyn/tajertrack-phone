name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and lint Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore source into repository (first run only)
        if: ${{ hashFiles('app/build.gradle.kts') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"
          mkdir -p /tmp/tajertrack-phone-bootstrap
          cat .bootstrap/source-*.b64 | base64 --decode > /tmp/tajertrack-phone-bootstrap/source.tar.xz
          xz --test /tmp/tajertrack-phone-bootstrap/source.tar.xz
          tar -xJf /tmp/tajertrack-phone-bootstrap/source.tar.xz -C /tmp/tajertrack-phone-bootstrap
          rsync -a /tmp/tajertrack-phone-bootstrap/tajertrack-phone/ ./
          git checkout -- .github/workflows/android.yml
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native TajerTrack Phone Android source"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble debug APK and run lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tajertrack-phone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tajertrack-phone-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
